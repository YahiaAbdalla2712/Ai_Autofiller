[project]
name = "autofiller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YahiaAbdalla2712", email = "yayaabdalla2712@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "isort>=9.0.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "qdrant-client>=1.19.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
autofiller = "autofiller:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
